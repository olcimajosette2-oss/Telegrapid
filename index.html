<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegrapid - Aplikasyon Konplè</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a202c 70%, #2d3748 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .hidden { display: none !important; }

        .auth-container {
            background: #2d3748;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .auth-container h2 { margin-bottom: 20px; color: #63b3ed; }
        .auth-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        .auth-container button {
            width: 100%;
            padding: 12px;
            background: #3182ce;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-container button:hover { background: #2b6cb0; }
        .toggle-link {
            margin-top: 15px;
            display: block;
            color: #90cdf4;
            cursor: pointer;
            font-size: 14px;
        }

        #app {
            background: #ffffff;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        #app h1 {
            color: #4a5568;
            font-size: 24px;
            margin-bottom: 10px;
        }
        #welcome-user {
            color: #3182ce;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #app input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 16px;
            background: #fff;
            color: #333;
        }
        #app button.action-btn {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        #app button.action-btn:hover {
            background-color: #5a67d8;
        }
        #output {
            margin-top: 15px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }
        .logout-btn {
            background: #e53e3e !important;
            margin-top: 15px !important;
            font-size: 14px !important;
            padding: 8px !important;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-box">
        <div id="signup-section">
            <h2>Kreye yon Kont</h2>
            <input type="text" id="reg-name" placeholder="Non Itilizatè">
            <input type="email" id="reg-email" placeholder="Imèl ou">
            <input type="password" id="reg-pass" placeholder="Modpas">
            <button onclick="ankeREnskripsyon()">Kreye Kont</button>
            <span class="toggle-link" onclick="chanjeFom()">Gen yon kont deja? Konekte w</span>
        </div>

        <div id="login-section" class="hidden">
            <h2>Konekte</h2>
            <input type="email" id="log-email" placeholder="Imèl ou">
            <input type="password" id="log-pass" placeholder="Modpas">
            <button onclick="fèKoneksyon()">Antre</button>
            <span class="toggle-link" onclick="montreBliyeModpas()" style="margin-top: 10px; font-size: 13px;">Mwen bliye modpas mwen?</span>
            <span class="toggle-link" onclick="chanjeFom()">Pa gen kont? Kreye yonn</span>
        </div>

        <div id="forgot-section" class="hidden">
            <h2>Rekipere Modpas</h2>
            <input type="email" id="forgot-email" placeholder="Antre imèl ou">
            <input type="password" id="new-pass" placeholder="Nouvo modpas">
            <button onclick="chanjeModpas()">Mete ajou modpas</button>
            <span class="toggle-link" onclick="retounenLogin()">Tounen nan Koneksyon</span>
        </div>
    </div>

    <div id="app" class="hidden">
        <h1>Telegrapid</h1>
        <div id="welcome-user"></div>
        <div class="card">
            <p>Ekri yon piblikasyon oswa yon mesaj:</p>
            <input type="text" id="user-input" placeholder="Ekri yon bagay...">
            <button class="action-btn" onclick="fèAksyon()">Voye</button>
        </div>
        <div id="output"></div>
        <button class="action-btn logout-btn" onclick="dekonekte()">Dekonekte</button>
    </div>

    <script>
        function chanjeFom() {
            document.getElementById('signup-section').classList.toggle('hidden');
            document.getElementById('login-section').classList.toggle('hidden');
        }

        window.onload = function() {
            let aktif = localStorage.getItem('itilizate_aktif');
            if (aktif) {
                montreAplikasyon(JSON.parse(aktif));
            }
        }

        function ankeREnskripsyon() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;

            if(name && email && pass) {
                let itilizate = { name, email, pass };
                localStorage.setItem('aktif_itilizate', JSON.stringify(itilizate));
                alert("Kont ou kreye avèk siksè! Koulye a ou ka konekte w.");
                chanjeFom();
            } else {
                alert("Tanpri ranpli tout chan yo!");
            }
        }

        function fèKoneksyon() {
            const email = document.getElementById('log-email').value;
            const pass = document.getElementById('log-pass').value;
            let soveKont = JSON.parse(localStorage.getItem('aktif_itilizate'));

            if(soveKont && soveKont.email === email && soveKont.pass === pass) {
                localStorage.setItem('itilizate_aktif', JSON.stringify(soveKont));
                montreAplikasyon(soveKont);
            } else {
                alert("Imèl ou oswa modpas ou pa kòrèk!");
            }
        }

        function montreAplikasyon(user) {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('welcome-user').innerText = "Byenveni, " + user.name + " (" + user.email + ")";
            aficheLis();
        }

        function dekonekte() {
            localStorage.removeItem('itilizate_aktif');
            location.reload();
        }

        function montreBliyeModpas() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('forgot-section').classList.remove('hidden');
        }

        function retounenLogin() {
            document.getElementById('forgot-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        function chanjeModpas() {
            const email = document.getElementById('forgot-email').value;
            const nouvoPass = document.getElementById('new-pass').value;
            let soveKont = JSON.parse(localStorage.getItem('aktif_itilizate'));

            if (soveKont && soveKont.email === email) {
                if (nouvoPass.trim() !== "") {
                    soveKont.pass = nouvoPass;
                    localStorage.setItem('aktif_itilizate', JSON.stringify(soveKont));
                    alert("Modpas ou chanje avèk siksè! Koulye a ou ka konekte ak nouvo modpas ou.");
                    retounenLogin();
                } else {
                    alert("Tanpri antre yon nouvo modpas ki valab!");
                }
            } else {
                alert("Imèl sa a pa koresponn ak okenn kont aktif!");
            }
        }

        let lisDone = JSON.parse(localStorage.getItem('telegrapid_done')) || [];

        function aficheLis() {
            const outputDiv = document.getElementById('output');
            if (lisDone.length === 0) {
                outputDiv.innerHTML = "<p style='color: gray; text-align: center; margin-top:15px;'>Pa gen done anrejistre yet.</p>";
                return;
            }
            
            let html = "<ul style='list-style-type: none; padding: 0; margin-top: 15px;'>";
            lisDone.forEach((item, index) => {
                html += `<li style='background: #edf2f7; margin: 8px 0; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; color: #333;'>
                            <span>${item}</span>
                            <button onclick='siprimeDone(${index})' style='background: #e53e3e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;'>X</button>
                         </li>`;
            });
            html += "</ul>";
            outputDiv.innerHTML = html;
        }

        function siprimeDone(index) {
            lisDone.splice(index, 1);
            localStorage.setItem('telegrapid_done', JSON.stringify(lisDone));
            aficheLis();
        }

        function fèAksyon() {
            const inputVal = document.getElementById('user-input').value;
            
            if (inputVal.trim() !== "") {
                lisDone.push(inputVal);
                localStorage.setItem('telegrapid_done', JSON.stringify(lisDone));
                document.getElementById('user-input').value = "";
                aficheLis();
            } else {
                alert("Tanpri ekri yon bagay anvan ou voye l!");
            }
        }
    </script>
</body>
</html>
