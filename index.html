<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegrapid - Annouyè Telegram</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: var(--accent);
    }
    form {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input, select, button {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 16px;
    }
    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:hover {
      opacity: 0.9;
    }
    .card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }
    .tag {
      font-size: 12px;
      background: #334155;
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Telegrapid</h1>

    <!-- Formulaire pou ajoute chanèl -->
    <form id="add-form">
      <input type="text" id="title" placeholder="Non chanèl / gwoup la" required>
      <input type="url" id="link" placeholder="Lyen Telegram (https://t.me/...)" required>
      <select id="type">
        <option value="Chanèl">Chanèl</option>
        <option value="Gwoup">Gwoup</option>
      </select>
      <button type="submit" id="submit-btn">Achte/Aji Chanèl la</button>
    </form>

    <!-- Lis kote chanèl yo ap parèt -->
    <div id="channels-list">Mape chaje chanèl yo...</div>
  </div>

  <script>
    // Konfigirasyon Supabase
    const SUPABASE_URL = 'https://xiirkprhkqcfmspvavsy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rGYu8noPCVHDpVrJ0RjSrA_JQwwMIj_';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('add-form');
    const channelsList = document.getElementById('channels-list');

    // Fonksyon pou chaje tout chanèl yo nan baz de done an
    async function fetchChannels() {
      const { data, error } = await supabase
        .from('channels')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        channelsList.innerHTML = '<p>Gen yon errè nan chaje done yo.</p>';
        console.error(error);
        return;
      }

      if (data.length === 0) {
        channelsList.innerHTML = '<p style="text-align:center;">Poko gen okenn chanèl. Wa premye moun ki ajoute youn!</p>';
        return;
      }

      channelsList.innerHTML = data.map(item => `
        <div class="card">
          <div>
            <strong>${item.title}</strong>
            <br>
            <span class="tag">${item.type}</span>
          </div>
          <a href="${item.link}" target="_blank">Rantre</a>
        </div>
      `).join('');
    }

    // Fonksyon pou anregistre yon nouvo chanèl
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const link = document.getElementById('link').value;
      const type = document.getElementById('type').value;

      const { error } = await supabase
        .from('channels')
        .insert([{ title, link, type }]);

      if (error) {
        alert('Erè nan anregistreman an: ' + error.message);
      } else {
        form.reset();
        fetchChannels(); // Rafrechi lis la otomatikman
      }
    });

    // Chaje lis la depi paj la louvri
    fetchChannels();
  </script>

</body>
</html>
