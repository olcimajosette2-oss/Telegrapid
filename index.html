<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegrapid - Gwoup, Chanèl & Stickers</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a202c 70%, #2d3748 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .hidden { display: none !important; }
        .auth-container, #app {
            background: #2d3748;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }
        #app { background: #ffffff; color: #333; }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        #app input, #app select { background: #fff; color: #333; border: 1px solid #cbd5e0; }
        button {
            width: 100%;
            padding: 10px;
            background: #3182ce;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background: #2b6cb0; }
        .toggle-link {
            margin-top: 12px;
            display: block;
            color: #90cdf4;
            cursor: pointer;
            font-size: 14px;
        }
        #app .toggle-link { color: #3182ce; }
        .section-box {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }
        .item-list {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        .item-row {
            background: #edf2f7;
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .logout-btn { background: #e53e3e !important; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- 1. PAJ KONEKSYON -->
    <div class="auth-container" id="auth-box">
        <div id="signup-section">
            <h2>Kreye yon Kont</h2>
            <input type="text" id="reg-name" placeholder="Non Itilizatè">
            <input type="email" id="reg-email" placeholder="Imèl ou">
            <input type="password" id="reg-pass" placeholder="Modpas">
            <button onclick="ankeREnskripsyon()">Kreye Kont</button>
            <span class="toggle-link" onclick="chanjeFom()">Gen yon kont deja? Konekte w</span>
        </div>

        <div id="login-section" class="hidden">
            <h2>Konekte</h2>
            <input type="email" id="log-email" placeholder="Imèl ou">
            <input type="password" id="log-pass" placeholder="Modpas">
            <button onclick="fèKoneksyon()">Antre</button>
            <span class="toggle-link" onclick="chanjeFom()">Pa gen kont? Kreye yonn</span>
        </div>
    </div>

    <!-- 2. PAJ PRENSIPAL -->
    <div id="app" class="hidden">
        <h1>Telegrapid</h1>
        <div id="welcome-user" style="color: #3182ce; font-weight: bold; margin-bottom: 10px;"></div>

        <!-- Kreye Gwoup / Chanèl -->
        <div class="section-box">
            <h3 style="margin: 0 0 10px 0; font-size: 16px; color: #2d3748;">Kreye Gwoup oswa Chanèl</h3>
            <input type="text" id="space-name" placeholder="Non Gwoup oswa Chanèl...">
            <select id="space-type">
                <option value="gwoup">Gwoup</option>
                <option value="chanel">Chanèl</option>
            </select>
            <button onclick="kreyeEspas()">Kreye l</button>
        </div>

        <!-- Lis Gwoup / Chanèl ki disponib -->
        <div class="section-box">
            <h3 style="margin: 0 0 10px 0; font-size: 16px; color: #2d3748;">Espas yo</h3>
            <div id="spaces-output" class="item-list"></div>
        </div>

        <!-- Piblikasyon ak Stickers -->
        <div class="section-box">
            <h3 style="margin: 0 0 10px 0; font-size: 16px; color: #2d3748;">Pataje ak Reyaji</h3>
            <input type="text" id="user-input" placeholder="Ekri yon post...">
            <select id="sticker-select">
                <option value="👍">👍 Thumbs Up</option>
                <option value="❤️">❤️ Kè</option>
                <option value="🔥">🔥 Dife</option>
                <option value="😂">😂 Ri</option>
            </select>
            <button onclick="fèAksyon()">Voye Post ak Sticker</button>
        </div>

        <div id="output" class="item-list" style="margin-top: 15px;"></div>
        <button class="logout-btn" onclick="dekonekte()">Dekonekte</button>
    </div>

    <script>
        function chanjeFom() {
            document.getElementById('signup-section').classList.toggle('hidden');
            document.getElementById('login-section').classList.toggle('hidden');
        }

        window.onload = function() {
            let aktif = localStorage.getItem('itilizate_aktif');
            if (aktif) {
                montreAplikasyon(JSON.parse(aktif));
            }
        }

        function ankeREnskripsyon() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            if(name && email && pass) {
                let itilizate = { name, email, pass };
                localStorage.setItem('aktif_itilizate', JSON.stringify(itilizate));
                alert("Kont ou kreye avèk siksè!");
                chanjeFom();
            } else { alert("Tanpri ranpli tout chan yo!"); }
        }

        function fèKoneksyon() {
            const email = document.getElementById('log-email').value;
            const pass = document.getElementById('log-pass').value;
            let soveKont = JSON.parse(localStorage.getItem('aktif_itilizate'));
            if(soveKont && soveKont.email === email && soveKont.pass === pass) {
                localStorage.setItem('itilizate_aktif', JSON.stringify(soveKont));
                montreAplikasyon(soveKont);
            } else { alert("Imèl oswa modpas pa kòrèk!"); }
        }

        function montreAplikasyon(user) {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('welcome-userinnerText'] = "Byenveni, " + user.name;
            document.getElementById('welcome-user').innerText = "Byenveni, " + user.name;
            aficheEspas();
            aficheLis();
        }

        function dekonekte() {
            localStorage.removeItem('itilizate_aktif');
            location.reload();
        }

        let lisEspas = JSON.parse(localStorage.getItem('telegrapid_espas')) || [];
        function kreyeEspas() {
            const name = document.getElementById('space-name').value;
            const type = document.getElementById('space-type').value;
            if(name.trim() !== "") {
                lisEspas.push({ name, type });
                localStorage.setItem('telegrapid_espas', JSON.stringify(lisEspas));
                document.getElementById('space-name').value = "";
                aficheEspas();
            } else { alert("Antre non espas la!"); }
        }

        function aficheEspas() {
            const div = document.getElementById('spaces-output');
            if(lisEspas.length === 0) { div.innerHTML = "<p style='color:gray; font-size:13px;'>Pa gen gwoup oswa chanèl ankò.</p>"; return; }
            let html = "";
            lisEspas.forEach(s => {
                html += `<div class="item-row"><span><strong>[${s.type.toUpperCase()}]</strong> ${s.name}</span></div>`;
            });
            div.innerHTML = html;
        }

        let lisDone = JSON.parse(localStorage.getItem('telegrapid_done')) || [];
        function aficheLis() {
            const outputDiv = document.getElementById('output');
            if (lisDone.length === 0) {
                outputDiv.innerHTML = "<p style='color: gray; font-size:13px;'>Pa gen piblikasyon ankò.</p>";
                return;
            }
            let html = "";
            lisDone.forEach((item, index) => {
                html += `<div class="item-row">
                            <span>${item.text} <b style="margin-left:5px;">${item.sticker}</b></span>
                            <button onclick='siprimeDone(${index})' style='background: #e53e3e; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 11px; width:auto;'>X</button>
                         </div>`;
            });
            outputDiv.innerHTML = html;
        }

        function siprimeDone(index) {
            lisDone.splice(index, 1);
            localStorage.setItem('telegrapid_done', JSON.stringify(lisDone));
            aficheLis();
        }

        function fèAksyon() {
            const inputVal = document.getElementById('user-input').value;
            const stickerVal = document.getElementById('sticker-select').value;
            if (inputVal.trim() !== "") {
                lisDone.push({ text: inputVal, sticker: stickerVal });
                localStorage.setItem('telegrapid_done', JSON.stringify(lisDone));
                document.getElementById('user-input').value = "";
                aficheLis();
            } else { alert("Tanpri ekri yon post!"); }
        }
    </script>
</body>
</html>
