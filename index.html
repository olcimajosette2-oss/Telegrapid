<!DOCTYPE html>
<html>
<head>
  <title>Telepib - Ajoute Chanèl</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .channel-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Promotion Chanèl Telegram</h1>
  
  <form id="addForm">
    <input type="text" id="title" placeholder="Non Chanèl" required>
    <input type="url" id="link" placeholder="Lyen (https://t.me/...)" required>
    <button type="submit">Ajoute Chanèl</button>
  </form>

  <div id="channelList"></div>
<script>
  const supabaseUrl = 'https://qdewfohnfjnwtqfkhloq.supabase.co';
const supabaseKey = 'sb_publishable_0JJ8P0_IdypBVfaOwCLa7A_oPWMTZ82';
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function fetchChannels() {
      const { data } = await supabase.from('channels').select('*');
      const list = document.getElementById('channelList');
      list.innerHTML = data.map(c => `<div class="channel-card"><h3>${c.title}</h3><a href="${c.link}" target="_blank">Vizite</a></div>`).join('');
    }

    document.getElementById('addForm').onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const link = document.getElementById('link').value;
      await supabase.from('channels').insert([{ title, link }]);
      fetchChannels();
    };

    fetchChannels();
  </script>
</body>
</html>
