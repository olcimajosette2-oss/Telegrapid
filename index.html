<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telepib</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0e1621; color: white; margin: 0; padding: 0; }
        .navbar { background-color: #17212b; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #5288c1; border-bottom: 1px solid #242f3d; }
        .container { padding: 15px; }
        .card { background-color: #17212b; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #242f3d; }
        .btn { background-color: #5288c1; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .input-box { width: 93%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #242f3d; background-color: #0e1621; color: white; }
    </style>
</head>
<body>

    <div class="navbar">TELEPIB</div>

    <div class="container">
        <!-- Zòn Enskripsyon -->
        <div class="card">
            <h3>Kreye Kont Ou</h3>
            <input type="text" class="input-box" placeholder="Non itilizatè...">
            <input type="password" class="input-box" placeholder="Mòdpa...">
            <button class="btn" onclick="alert('Kont kreye ak siksè!')">Rantre sou Telepib</button>
        </div>

        <!-- Zòn Achte Etwal -->
        <div class="card">
            <h3>Solde Etwal ⭐</h3>
            <p>Etwal ou genyen: <b>0 ⭐</b></p>
            <button class="btn" style="background-color: #e5a93c;" onclick="alert('Sistèm Kripto a ap vini soti nan Supabase!')">Achte Etwal ak Kripto (USDT)</button>
        </div>
    </div>

</body>
</html>
