<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotion Telegram & Kripto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Header & Wallet */
    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: #1e293b;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
    }

    .btn-wallet {
      background-color: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-wallet:hover {
      background-color: #d97706;
    }

    /* Main Container */
    .main-container {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: #1e293b;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 20px;
      color: #f1f5f9;
      border-bottom: 2px solid #334155;
      padding-bottom: 10px;
    }

    /* Auth Buttons */
    .auth-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-auth {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      font-size: 13px;
    }

    .btn-email { background-color: #ef4444; }
    .btn-phone { background-color: #10b981; }

    .user-status {
      margin-bottom: 15px;
      padding: 8px;
      background: #0f172a;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
    }

    /* Form Styles */
    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #0284c7;
      color: white;
    }

    /* Feed & Items */
    .item-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .badge-chanel { background-color: #0284c7; color: white; }
    .badge-gwoup { background-color: #16a34a; color: white; }

    .item-title {
      font-size: 16px;
      font-weight: bold;
    }

    .item-link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      display: block;
      margin: 8px 0;
    }

    /* Stars & Reactions */
    .stars {
      color: #f59e0b;
      cursor: pointer;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .reactions {
      display: flex;
      gap: 10px;
    }

    .reaction-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 12px;
      cursor: pointer;
    }

    .reaction-btn:hover {
      background: #334155;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">TelegramRapid 🚀</div>
    <button class="btn-wallet" onclick="connectWallet()" id="walletBtn">Konekte Wallet (Kripto)</button>
  </header>

  <div class="main-container">
    
    <!-- Kreye Chanèl / Gwoup -->
    <div class="card">
      <h2>Mete Chanèl oswa Gwoup ou</h2>
      
      <div class="auth-buttons">
        <button class="btn-auth btn-email" onclick="loginEmail()">Imèl Login</button>
        <button class="btn-auth btn-phone" onclick="loginPhone()">Telefòn Login</button>
      </div>

      <div class="user-status" id="userStatus">Statut: Pa konekte</div>

      <form id="promoForm" onsubmit="addTelegramItem(event)">
        <label>Tip Piblikasyon</label>
        <select id="type">
          <option value="Chanèl">Chanèl Telegram</option>
          <option value="Gwoup">Gwoup Telegram</option>
        </select>

        <label>Non Chanèl / Gwoup</label>
        <input type="text" id="name" placeholder="Egz: MonKriptoAyiti" required>

        <label>Lyen Telegram</label>
        <input type="url" id="link" placeholder="https://t.me/non_ou" required>

        <button type="submit" class="btn-submit">Publiye Kounye a</button>
      </form>
    </div>

    <!-- Lis Chanèl ak Gwoup ki pibliye -->
    <div class="card">
      <h2>Lis Chanèl & Gwoup yo</h2>
      <div id="itemList">
        
        <!-- Egzantp 1 -->
        <div class="item-card">
          <div class="item-header">
            <span class="item-title">Crypto Haïti News</span>
            <span class="badge badge-chanel">Chanèl</span>
          </div>
          <a href="https://t.me/example" target="_blank" class="item-link">https://t.me/example</a>
          <div class="stars">★★★★★</div>
          <div class="reactions">
            <button class="reaction-btn" onclick="react(this)">👍 <span>12</span></button>
            <button class="reaction-btn" onclick="react(this)">🔥 <span>8</span></button>
            <button class="reaction-btn" onclick="react(this)">❤️ <span>5</span></button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    let currentUser = null;

    function loginEmail() {
      let email = prompt("Antre imèl ou:");
      if (email) {
        currentUser = email;
        document.getElementById("userStatus").innerText = "Konekte kòm (Imèl): " + email;
      }
    }

    function loginPhone() {
      let phone = prompt("Antre nimewo telefòn ou (+509...):");
      if (phone) {
        currentUser = phone;
        document.getElementById("userStatus").innerText = "Konekte kòm (Telefòn): " + phone;
      }
    }

    async function connectWallet() {
      if (window.ethereum) {
        try {
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          const wallet = accounts[0];
          document.getElementById("walletBtn").innerText = wallet.substring(0,6) + "..." + wallet.substring(wallet.length - 4);
          alert("Wallet konekte ak siksè!");
        } catch (error) {
          alert("Erè nan koneksyon wallet la.");
        }
      } else {
        alert("Tanpri enstale MetaMask oswa yon Wallet Kripto nan navigatè w la!");
      }
    }

    function addTelegramItem(e) {
      e.preventDefault();
      
      if (!currentUser) {
        alert("Tanpri konekte ak Imèl oswa Telefòn anvan w pibliye!");
        return;
      }

      const type = document.getElementById("type").value;
      const name = document.getElementById("name").value;
      const link = document.getElementById("link").value;

      const badgeClass = type === "Chanèl" ? "badge-chanel" : "badge-gwoup";

      const newItem = `
        <div class="item-card">
          <div class="item-header">
            <span class="item-title">${name}</span>
            <span class="badge ${badgeClass}">${type}</span>
          </div>
          <a href="${link}" target="_blank" class="item-link">${link}</a>
          <div class="stars">★★★★★</div>
          <div class="reactions">
            <button class="reaction-btn" onclick="react(this)">👍 <span>0</span></button>
            <button class="reaction-btn" onclick="react(this)">🔥 <span>0</span></button>
            <button class="reaction-btn" onclick="react(this)">❤️ <span>0</span></button>
          </div>
        </div>
      `;

      document.getElementById("itemList").insertAdjacentHTML('afterbegin', newItem);
      document.getElementById("promoForm").reset();
    }

    function react(btn) {
      let span = btn.querySelector("span");
      let count = parseInt(span.innerText);
      span.innerText = count + 1;
    }
  </script>

</body>
</html>
